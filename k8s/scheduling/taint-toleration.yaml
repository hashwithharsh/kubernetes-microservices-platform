apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-scheduled
  namespace: voting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-scheduled
  template:
    metadata:
      labels:
        app: worker-scheduled
    spec:
      tolerations:
        - key: workload
          operator: Equal
          value: worker
          effect: NoSchedule
      containers:
        - name: worker
          image: voting-worker:1.0
