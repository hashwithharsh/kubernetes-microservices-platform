apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: voting
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: voting-app
      containers:
        - name: worker
          image: voting-worker:1.0
          env:
            - name: REDIS_HOST
              value: redis
            - name: DB_HOST
              value: postgres
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep -f dotnet >/dev/null"]
            initialDelaySeconds: 10
            periodSeconds: 20
